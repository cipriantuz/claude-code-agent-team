name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    name: Guard + config tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Git identity for test repos
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
      - name: Run unittest
        run: python -m unittest discover -s tests -v

  hook-tests:
    name: PowerShell hook tests (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Git identity for test repos
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
      - name: Hooks under Windows PowerShell 5.1
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/hooks.Tests.ps1
      - name: Hooks under PowerShell 7
        shell: pwsh
        run: pwsh -NoProfile -File tests/hooks.Tests.ps1
